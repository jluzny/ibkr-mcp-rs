# Restart-limit hardening for ibkr-mcp.service.
# Install at /etc/systemd/system/ibkr-mcp.service.d/10-restart-policy.conf with
#   sudo bash scripts/install-mcp-tuple.sh --mode=dropin
#
# Scope — read this before using it as the only change:
# a systemd drop-in can only ADD to a unit. Verified on systemd 261: an empty
# `Requires=` / `After=` assignment in a drop-in does NOT remove the
# `Requires=ib-gateway-live.service` inherited from the main unit file, even after
# daemon-reload. The gateway-coupling change therefore needs the full unit
# (systemd/ibkr-mcp.service). This drop-in covers what a drop-in actually can:
# the restart limits and the restart delay. Installing it alongside the hardened
# unit is harmless — the values are identical.

[Unit]
# At most 5 starts per 5 minutes. The canary no longer exits on an unreachable
# broker, so reaching this limit means a genuinely broken process.
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
# Restarts are exceptional again, so there is no reason to come back within 5s.
# The old 5s cadence amplified the gateway's client_id handshake storm while it
# was mid-login.
Restart=always
RestartSec=30
