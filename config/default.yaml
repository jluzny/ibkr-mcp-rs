# Default configuration for ibkr-mcp-rs

# IBKR connection settings
ibkr:
  host: "127.0.0.1"
  port: 4003        # Gateway live trading
  client_id: 100    # Unique client ID for this MCP server
  paper_trading: false
  read_only: true
  connection_timeout_secs: 15
  retry_attempts: 100
  retry_delay_ms: 1000

# MCP server settings
mcp:
  host: "0.0.0.0"
  port: 8881
  session_timeout_secs: 0   # 0 = never auto-close

# Market data caching
market_data:
  real_time_ttl_secs: 15       # 15s during market hours (was 5s)
  delayed_ttl_secs: 3600       # 1h for closed-market / delayed data (was 60s)
  max_cache_entries: 1000

# Logging
logging:
  level: "info"
  format: "json"

# Health / tool-authorization contract version (PLAN-gateway-supervisor-refactor
# 6.1). Explicit, never inferred: the deployed tuple declares this value in three
# places that must agree - here, IBKR_MCP_HEALTH__CONTRACT_VERSION in
# systemd/ibkr-mcp.service, and health_contract_version in the artifact manifest.
# ibkr-stack/scripts/check-mcp-policy.sh fails the tuple on a mismatch, and the
# running process reports it on /version, /health/live and /health/ready as
# `contractVersion`.
#   legacy-v0 = pre-existing tool-authorization semantics, no readiness lease
#   lease-v1  = staged in Phase 2; never a fallback for a missing/expired lease
health:
  contract_version: "legacy-v0"
